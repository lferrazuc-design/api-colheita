services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: colheita
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d colheita"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/colheita
      DB_USER: app
      DB_PASSWORD: app
    ports:
      - "8081:8081"
    # Para subir só o banco (e rodar a API pelo IntelliJ): docker compose up -d db
    profiles: ["completo"]

volumes:
  dados-postgres:
