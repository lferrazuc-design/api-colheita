spring.application.name=api-colheita
server.port=8081

# Banco de dados (valores padrão para rodar local; no Docker vêm das variáveis de ambiente)
# Usuário e senha abaixo são fictícios, só para o banco local de desenvolvimento.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/colheita}
spring.datasource.username=${DB_USER:app}
spring.datasource.password=${DB_PASSWORD:app}

# Cria/atualiza as tabelas automaticamente a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Carrega frentes fictícias de exemplo ao subir (ver config/DadosExemplo.java)
app.dados-exemplo=true

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Expõe só o health check
management.endpoints.web.exposure.include=health
